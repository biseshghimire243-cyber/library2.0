<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | Library Management System</title>

    <link rel="stylesheet" href="css/students.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-book"></i>
            <span>LibraryMS</span>
        </div>

        <ul>

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li>
                <a href="books.html">
                    <i class="fa-solid fa-book"></i>
                    Books
                </a>
            </li>

            <li class="active">
                <a href="students.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    Students
                </a>
            </li>

            <li>
                <a href="issue.html">
                    <i class="fa-solid fa-book-open-reader"></i>
                    Issue / Return
                </a>
            </li>

            <li>
                <a href="about.html">
                    <i class="fa-solid fa-circle-info"></i>
                    About
                </a>
            </li>

            <li>
                <a href="contact.html">
                    <i class="fa-solid fa-envelope"></i>
                    Contact
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header>

            <h1>Student Management</h1>

            <p>
                Add, search and manage student records.
            </p>

        </header>

        <!-- Student Form -->

        <section class="form-section">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="row">

                    <input
                        type="text"
                        id="name"
                        placeholder="Student Name"
                        required>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required>

                </div>

                <div class="row">

                    <input
                        type="text"
                        id="phone"
                        placeholder="Phone Number"
                        required>

                    <input
                        type="text"
                        id="address"
                        placeholder="Address">

                </div>

                <div class="row">

                    <input
                        type="text"
                        id="course"
                        placeholder="Course">

                    <input
                        type="text"
                        id="semester"
                        placeholder="Semester">

                </div>

                <button type="submit">

                    <i class="fa-solid fa-user-plus"></i>

                    Add Student

                </button>

            </form>

        </section>

        <!-- Search -->

        <section class="search-section">

            <input
                type="text"
                id="search"
                placeholder="Search student...">

        </section>

        <!-- Student Table -->

        <section class="table-section">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Address</th>

                        <th>Course</th>

                        <th>Semester</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="js/students.js"></script>

</body>
</html>
