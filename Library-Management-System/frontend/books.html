<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | Library Management System</title>

    <link rel="stylesheet" href="css/books.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2><i class="fa-solid fa-book"></i> LibraryMS</h2>

        <ul>

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li class="active">
                <a href="books.html">
                    <i class="fa-solid fa-book"></i>
                    Books
                </a>
            </li>

            <li>
                <a href="students.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    Students
                </a>
            </li>

            <li>
                <a href="issue.html">
                    <i class="fa-solid fa-book-open-reader"></i>
                    Issue / Return
                </a>
            </li>

            <li>
                <a href="about.html">
                    <i class="fa-solid fa-circle-info"></i>
                    About
                </a>
            </li>

            <li>
                <a href="contact.html">
                    <i class="fa-solid fa-envelope"></i>
                    Contact
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->
    <main class="main-content">

        <header>

            <h1>Book Management</h1>

            <p>
                Add, manage and search books in your library.
            </p>

        </header>

        <!-- Add Book Form -->

        <section class="form-section">

            <h2>Add New Book</h2>

            <form id="bookForm">

                <div class="input-group">

                    <input
                        type="text"
                        id="title"
                        placeholder="Book Title"
                        required>

                    <input
                        type="text"
                        id="author"
                        placeholder="Author"
                        required>

                </div>

                <div class="input-group">

                    <input
                        type="text"
                        id="category"
                        placeholder="Category"
                        required>

                    <input
                        type="number"
                        id="quantity"
                        placeholder="Quantity"
                        required>

                </div>

                <button type="submit">
                    <i class="fa-solid fa-plus"></i>
                    Add Book
                </button>

            </form>

        </section>

        <!-- Search -->

        <section class="search-section">

            <input
                type="text"
                id="search"
                placeholder="Search book by title or author...">

        </section>

        <!-- Table -->

        <section class="table-section">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Title</th>

                        <th>Author</th>

                        <th>Category</th>

                        <th>Quantity</th>

                        <th>Available</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="bookTable">

                    <!-- Data loads here -->

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="js/books.js"></script>

</body>
</html>
