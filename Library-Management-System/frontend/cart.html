<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart & Checkout - LibraryMS</title>
  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <div class="logo">
      <i class="fa-solid fa-book-open-reader"></i>
      LibraryMS
    </div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="books.html">Books</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="store.html">Store</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <a href="cart.html" class="cart-btn active">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="cartCount">0</span>
    </a>
  </nav>

  <!-- ================= CART & CHECKOUT CONTAINER ================= -->
  <div class="cart-container" style="max-width: 1100px; margin: 2rem auto; padding: 0 5%; display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
    
    <!-- Left Column: Items List -->
    <div class="cart-items-section">
      <h2 style="margin-bottom: 1rem; color: #1e293b;">🛒 Your Cart Items</h2>
      <div id="cartItemsList" style="background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
        <!-- Items dynamically loaded via JS -->
      </div>
    </div>

    <!-- Right Column: Shipping & Payment Form -->
    <div class="checkout-section" style="background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: fit-content;">
      <h2 style="margin-bottom: 1rem; color: #1e293b;">Checkout Details</h2>
      
      <form id="checkoutForm">
        <!-- Customer Details Section -->
        <div style="margin-bottom: 1.5rem;">
          <h3 style="font-size: 0.95rem; color: #475569; margin-bottom: 0.75rem;">Shipping Information</h3>
          
          <div style="margin-bottom: 0.75rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.25rem;">Full Name *</label>
            <input type="text" id="custName" placeholder="e.g. Bishesh Ghimire" required style="width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
          </div>

          <div style="margin-bottom: 0.75rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.25rem;">Phone Number *</label>
            <input type="tel" id="custPhone" placeholder="e.g. 9800000000" required style="width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
          </div>

          <div style="margin-bottom: 0.75rem;">
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 0.25rem;">Delivery Address *</label>
            <textarea id="custAddress" placeholder="Street, City, Landmark" rows="2" required style="width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem; resize: vertical;"></textarea>
          </div>
        </div>

        <hr style="margin: 1rem 0; border: 0; border-top: 1px solid #e2e8f0;">

        <!-- Order Summary -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
          <span>Items Count:</span>
          <strong id="summaryCount">0</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
          <span>Delivery Fee:</span>
          <span>NPR 100</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 1.1rem; margin: 0.75rem 0 1.25rem;">
          <strong>Total Amount:</strong>
          <strong id="summaryTotal" style="color: #0284c7;">NPR 0</strong>
        </div>

        <!-- Payment Options -->
        <h3 style="margin-bottom: 0.75rem; font-size: 0.95rem; color: #475569;">Payment Method</h3>
        <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">
            <input type="radio" name="payment" value="esewa" checked>
            <span>eSewa Mobile Wallet</span>
          </label>
          <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">
            <input type="radio" name="payment" value="khalti">
            <span>Khalti Digital Wallet</span>
          </label>
          <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">
            <input type="radio" name="payment" value="banking">
            <span>Mobile / ConnectIPS</span>
          </label>
          <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-size: 0.9rem;">
            <input type="radio" name="payment" value="cod">
            <span>Cash on Delivery</span>
          </label>
        </div>

        <button type="submit" style="width: 100%; padding: 0.8rem; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
          Proceed to Pay
        </button>
      </form>
    </div>

  </div>

  <!-- ================= FOOTER ================= -->
  <footer>
    <p>© 2026 Library Management System | Developed by Bishesh Ghimire</p>
  </footer>

  <script src="js/cart.js"></script>
</body>

</html>
